<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WSJ 深读 · Editorial Renaissance 审读与并排裁决</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f141c;
      --card-bg: #18202c;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 24px;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 24px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    .title-group h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--accent);
      color: #000;
      font-weight: 700;
    }
    .tab-bar {
      display: flex;
      gap: 10px;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: #2563eb;
      color: #fff;
      border-color: #3b82f6;
    }
    .viewport-ctrl {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .vp-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .vp-btn.active {
      background: #334155;
      color: #fff;
    }
    .frame-container {
      max-width: 1400px;
      margin: 0 auto;
      height: calc(100vh - 120px);
      display: flex;
      justify-content: center;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #faf8f4;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>
        <span>WSJ 深读 · Editorial Renaissance 方案裁决面板</span>
        <span class="badge">E2-001 GOLD STANDARD</span>
      </h1>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">
        目标报道：Heather Gillers《美国人的储蓄助燃私人信贷》· A1 头版重磅调查 · 20段正文逐字保留
      </p>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="loadView('index.html', this)">方案 A: 调查审计态 (Gold Standard)</button>
      <button class="tab-btn" onclick="loadView('direction-b.html', this)">方案 B: 纯文学特写态</button>
      <button class="tab-btn" onclick="loadView('../../dist/index.html#s-E2-001', this)">旧生产页 (Baseline)</button>
    </div>
    <div class="viewport-ctrl">
      <button class="vp-btn active" onclick="setViewport('100%', this)">桌面 (100%)</button>
      <button class="vp-btn" onclick="setViewport('768px', this)">平板 (768px)</button>
      <button class="vp-btn" onclick="setViewport('390px', this)">手机 (390px)</button>
    </div>
  </header>
  <div class="frame-container">
    <iframe id="preview-frame" src="index.html"></iframe>
  </div>
  <script>
    function loadView(url, btn) {
      document.getElementById('preview-frame').src = url;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    function setViewport(width, btn) {
      document.getElementById('preview-frame').style.width = width;
      document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
